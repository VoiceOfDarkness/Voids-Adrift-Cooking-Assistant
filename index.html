<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galley Calculator — Voids Adrift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Spectral:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

:root{
  --deep:#0f2430;
  --deep2:#16323f;
  --parch:#ece2cc;
  --parch2:#ddd0ae;
  --ink:#20180f;
  --rust:#b3572e;
  --rust-dim:#8a4526;
  --teal:#4a8888;
  --gold:#c9a24b;
  --line: rgba(32,24,15,0.18);
}
*{box-sizing:border-box;}
html,body{overflow-x:hidden;max-width:100%;}
body{
  margin:0;
  background:var(--deep);
  font-family:'Spectral',serif;
  color:var(--ink);
  padding:32px 16px 60px;
}
.wrap{max-width:960px;margin:0 auto;width:100%;}

header{
  text-align:center;
  color:var(--parch);
  margin-bottom:28px;
}
header .eyebrow{
  font-family:'Space Mono',monospace;
  font-size:0.72rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:6px;
}
header h1{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:2.4rem;
  margin:0;
}
header p{
  font-size:0.92rem;
  color:#a9bcc4;
  margin:8px 0 0;
}

.layout{
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  gap:22px;
  align-items:start;
}
@media (max-width:800px){ .layout{grid-template-columns:1fr;} }

.panel{
  background:var(--parch);
  border-radius:8px;
  padding:26px 28px;
  border-left:8px solid var(--deep2);
  min-width:0;
}
@media (max-width:480px){
  .panel{padding:20px 16px;}
  body{padding:24px 8px 48px;}
}
.panel h2{
  font-family:'Fraunces',serif;
  font-size:1.1rem;
  font-weight:600;
  margin:0 0 16px;
}

.slot-row{
  display:grid;
  grid-template-columns:24px 1fr;
  grid-template-areas:
    "num select"
    "gap qty";
  align-items:center;
  column-gap:10px;
  row-gap:10px;
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.slot-row:last-of-type{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.slot-num{
  grid-area:num;
  font-family:'Space Mono',monospace;
  font-size:0.8rem;
  color:var(--rust-dim);
  text-align:center;
}
.slot-select{grid-area:select;min-width:0;}
select{
  width:100%;
  font-family:'Spectral',serif;
  font-size:0.95rem;
  padding:8px 10px;
  border-radius:4px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.5);
  color:var(--ink);
}
.qty-wrap{
  grid-area:qty;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.qty-wrap input[type=range]{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  accent-color:var(--rust);
}
.qty-val{
  font-family:'Space Mono',monospace;
  font-size:0.85rem;
  width:26px;
  flex-shrink:0;
  text-align:right;
}

.control-block{margin-top:20px;}
.control-block label{
  display:block;
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--rust-dim);
  margin-bottom:8px;
}
.method-btns{display:flex;gap:8px;}
.method-btn{
  flex:1;
  padding:10px 8px;
  text-align:center;
  border-radius:4px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.35);
  cursor:pointer;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:0.92rem;
  transition:background 0.15s, border-color 0.15s;
}
.method-btn.active{
  background:var(--deep2);
  color:var(--parch);
  border-color:var(--deep2);
}
.mod-wrap{display:flex;align-items:center;gap:12px;min-width:0;}
.mod-wrap input[type=range]{flex:1 1 auto;min-width:0;width:100%;accent-color:var(--rust);}
.mod-val{
  font-family:'Space Mono',monospace;
  font-size:1rem;
  font-weight:bold;
  width:34px;
  text-align:center;
  color:var(--deep2);
}
/* results panel */
.result-tag{
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--rust);
  margin-bottom:4px;
}
.dish-name{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:1.7rem;
  margin:0 0 4px;
}
.dish-sub{
  font-size:0.88rem;
  color:#3a2f22;
  margin-bottom:18px;
}

.tier-track{
  display:flex;
  gap:3px;
  margin-bottom:6px;
}
.tier-seg{
  flex:1;
  height:14px;
  border-radius:2px;
  background:var(--line);
}
.tier-seg.base-fill{background:var(--gold);}
.tier-seg.bonus-fill{background:var(--rust);}
.tier-caption{
  display:flex;
  justify-content:space-between;
  font-family:'Space Mono',monospace;
  font-size:0.66rem;
  color:#5f5e5a;
  margin-bottom:18px;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}
.stat-card{
  background:rgba(255,255,255,0.4);
  border-radius:4px;
  padding:10px 12px;
}
.stat-label{
  font-family:'Space Mono',monospace;
  font-size:0.62rem;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--rust-dim);
  margin-bottom:3px;
}
.stat-value{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:1.25rem;
}

.buff-box{
  background:var(--deep2);
  color:var(--parch);
  border-radius:5px;
  padding:14px 16px;
  margin-bottom:14px;
}
.buff-box .label{
  font-family:'Space Mono',monospace;
  font-size:0.64rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:6px;
}
.buff-box .value{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.05rem;
  margin-bottom:2px;
}
.buff-box .sub{opacity:0.85;font-size:0.82rem;}

.heal-box{
  background:rgba(255,255,255,0.4);
  border-radius:5px;
  padding:14px 16px;
  font-size:0.88rem;
  line-height:1.5;
}
.heal-box b{color:var(--deep2);}

.notice-box{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:rgba(179,87,46,0.12);
  border:1px solid rgba(179,87,46,0.45);
  border-radius:5px;
  padding:11px 14px;
  margin-bottom:16px;
  font-size:0.85rem;
  line-height:1.45;
  color:var(--rust-dim);
}
.notice-box .notice-icon{
  font-family:'Space Mono',monospace;
  font-weight:bold;
  font-size:0.85rem;
  flex-shrink:0;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--rust);
  color:var(--parch);
  display:flex;
  align-items:center;
  justify-content:center;
}
.notice-box b{color:var(--ink);}

.flavor-bars{margin-top:6px;}
.flavor-row{
  display:grid;
  grid-template-columns:70px 1fr 34px;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.flavor-label{
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  color:#5f5e5a;
}
.flavor-track{
  height:10px;
  background:var(--line);
  border-radius:2px;
  overflow:hidden;
}
.flavor-fill{
  height:100%;
  background:var(--teal);
}
.flavor-fill.dominant{background:var(--rust);}
.flavor-num{
  font-family:'Space Mono',monospace;
  font-size:0.68rem;
  text-align:right;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Voids Adrift</div>
    <h1>Galley Calculator</h1>
    <p>Live off the current cooking formulas: ingredient flavor, quality tiers, technique scaling, and Well Fed buffs.</p>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>Ingredients</h2>
      <div id="slots"></div>

      <div class="control-block">
        <label>Cooking method</label>
        <div class="method-btns" id="methodBtns"></div>
      </div>

      <div class="control-block">
        <label>Technique modifier (minigame result)</label>
        <div class="mod-wrap">
          <input type="range" id="modSlider" min="-4" max="5" step="1" value="0">
          <div class="mod-val" id="modVal">0</div>
        </div>
      </div>
    </div>

    <div class="panel" id="resultPanel"></div>
  </div>
</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
